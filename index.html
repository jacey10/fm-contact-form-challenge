<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="preload" href="assets/fonts/karla-v33-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/karla-v33-latin-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <title>Frontend Mentor | Contact form</title>
  </head>
  
  <body>

    <main id="formContainer" class="form--container">

      <section class="success--popup hidden">
        <div class="success--top--block">
          <img src="assets/icons/icon-success-check.svg" alt="">
          <span>Message Sent!</span>
        </div>
        <p>Thanks for completing the form. We'll be in touch soon!</p>
      </section>

      <form id="form" class="main__contact--form" novalidate>
        <h2 class="form--heading">Contact Us</h2>

        <section class="name--surname--container">
          <div class="form--control name--container">
            <label for="name" class="required">First Name</label>
            <input type="text" id="name" name="firstName" class="field" required>
            <div class="error"></div>
          </div>
            
          <div class="form--control">
            <label for="surname" class="required">Last Name</label>
            <input type="text" id="surname" name="lastName" class="field" required>
            <div class="error"></div>
          </div>
        </section>

        <div class="form--control">
          <label for="email" class="required">Email Address</label>
          <input type="email" id="email" name="email" class="field" required>
          <div class="error hidden"></div>
          
        </div>

        <div class="form--control">
          <fieldset class="query--container">
            <legend class="required">Query Type</legend>
            <label class="radio">
              <input type="radio" id="queryGeneral" name="queryType" value="general">
              General Enquiry
            </label>

            <label class="radio required">
              <input type="radio" id="querySupport" name="queryType" value="support">
              Support Request
            </label>
          </fieldset>
          <div class="error radioError"></div>
        </div>

        <div class="form--control">
          <label for="message" class="required">Message</label>
          <textarea id="message" name="message" class="field" required></textarea>
          <div class="error"></div>
        </div>

        <label for="consent">
          <div class="consent--control">
            <input type="checkbox" id="consent" name="consent" required>
            <span class="required"> I consent to being contacted by the team</span>
          </div>
          <div class="error"></div>
        </label>
          
        <button type="submit" class="submit--btn">Submit</button>

      </form>

    </main>

  </body>
</html>
