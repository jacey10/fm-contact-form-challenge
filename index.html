<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="preload" href="assets/fonts/karla-v33-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/karla-v33-latin-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <title>Frontend Mentor | Contact form</title>
  </head>
  
  <body>

    <main id="formContainer" class="form--container">

      <div class="success--popup hidden" role="alert">
        <div class="success--top--block">
          <img src="assets/icons/icon-success-check.svg" alt="">
          <p>Message Sent!</p>
        </div>
        <p>Thanks for completing the form. We'll be in touch soon!</p>
      </div>

      <form id="form" class="main__contact--form" novalidate>
        <h2 class="form--heading">Contact Us</h2>

        <div class="name--surname--container">
          <div class="form--control name--container">
            <label for="name" class="required">First Name</label>
            <input type="text" id="name" name="firstName" class="field" aria-describedby="nameError" required>
            <div id="nameError" class="error"></div>
          </div>
            
          <div class="form--control">
            <label for="surname" class="required">Last Name</label>
            <input type="text" id="surname" name="lastName" class="field" aria-describedby="surnameError" required>
            <div id="surnameError" class="error"></div>
          </div>
        </div>

        <div class="form--control">
          <label for="email" class="required">Email Address</label>
          <input type="email" id="email" name="email" class="field" aria-describedby="emailError" required>
          <div id="emailError" class="error"></div>
        </div>

        <div class="form--control">
          <fieldset class="query--container">
            <legend class="required">Query Type</legend>
            <label class="radio">
              <input type="radio" id="queryGeneral" name="queryType" value="general" aria-describedby="queryError">
              General Enquiry
            </label>

            <label class="radio">
              <input type="radio" id="querySupport" name="queryType" value="support" aria-describedby="queryError">
              Support Request
            </label>
          </fieldset>
          <div id="queryError" class="error radio--error"></div>
        </div>

        <div class="form--control">
          <label for="message" class="required">Message</label>
          <textarea id="message" name="message" class="field" aria-describedby="messageError" required></textarea>
          <div id="messageError" class="error"></div>
        </div>

        <div class="consent--control">
          <input type="checkbox" id="consent" name="consent" aria-describedby="consentError" required>
          <label for="consent" class="required consent--label">I consent to being contacted by the team</label>
        </div>
        <div id="consentError" class="error consent--error"></div>
       
        <button type="submit" id="submitBtn" class="submit--btn">Submit</button>
      </form>
    </main>
  </body>
</html>
